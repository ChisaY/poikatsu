<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#111111"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="ポイ活"/>
<link rel="manifest" href="/manifest.json"/>
<title>ポイ活カウンター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#111;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;color:#f0f0f0;}
button{touch-action:manipulation;cursor:pointer;border:none;background:none;}
input{outline:none;}
body{overscroll-behavior:none;}
#app{max-width:100%;margin:0 auto;min-height:100vh;background:#111;position:relative;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #3a3a3c;background:#111;position:sticky;top:0;z-index:10;}
.hdr-side{display:flex;align-items:center;min-width:80px;}
.hdr-side.right{justify-content:flex-end;}
.hdr-center{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:4px;pointer-events:none;}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:1px;}
.nav-arrow{color:#f0a500;font-size:22px;font-weight:900;padding:0 6px;pointer-events:auto;background:none;border:none;cursor:pointer;}
.nav-arrow:disabled{opacity:.25;}
.hdr-btn{padding:4px 6px;font-size:15px;border-radius:8px;}

/* Goal bar */
.goal-wrap{padding:4px 10px 3px;cursor:pointer;}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.goal-label{font-size:12px;font-weight:700;}
.goal-val{font-size:12px;}
.goal-val .cur{color:#f0a500;font-weight:800;}
.goal-val .muted{color:#8e8e93;}
.goal-val .rem{color:#8e8e93;font-size:12px;}
.bar-bg{height:4px;background:#2c2c2e;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .3s ease;}

/* Banners */
.banner-past{background:#2a2000;color:#f0a500;text-align:center;font-size:12px;padding:5px;border-top:1px solid #7a5200;border-bottom:1px solid #7a5200;}
.banner-ok{background:#1a3a1a;color:#34c759;text-align:center;font-size:13px;font-weight:700;padding:7px;}
.today-btn{display:block;margin:4px auto;background:none;border:1px solid #f0a500;border-radius:20px;color:#f0a500;font-size:11px;padding:3px 14px;}
.add-wrap{text-align:right;padding:2px 10px 4px;}
.add-btn{background:#f0a500;border-radius:24px;color:#000;font-weight:800;font-size:12px;padding:5px 14px;}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:0 5px 5px;}
@media(max-width:320px){.grid{grid-template-columns:1fr 1fr;}}
.card{background:#1c1c1e;border-radius:8px;padding:5px 5px 5px;border:1px solid #3a3a3c;display:flex;flex-direction:column;gap:2px;position:relative;}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
.site-name{font-size:10px;font-weight:700;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.count-val{font-size:13px;font-weight:900;margin-top:0;}
.menu-btn{background:#2c2c2e;border-radius:5px;width:18px;height:18px;font-size:11px;color:#8e8e93;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.plus-btn{background:#f0a500;border-radius:6px;min-height:26px;height:6.5vw;max-height:36px;font-size:18px;font-weight:900;color:#000;width:100%;}
.minus-btn{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:6px;min-height:22px;height:5.5vw;max-height:30px;font-size:16px;font-weight:700;color:#8e8e93;width:100%;}
.plus-btn:disabled,.minus-btn:disabled{opacity:.4;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:#1c1c1e;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:100%;}
.modal-title{font-size:17px;font-weight:800;text-align:center;margin-bottom:18px;}
.modal label{display:block;color:#8e8e93;font-size:12px;font-weight:600;letter-spacing:.5px;margin-bottom:5px;}
.modal input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #3a3a3c;background:#2c2c2e;color:#f0f0f0;font-size:15px;margin-bottom:14px;}
.step-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:14px;}
.step-chip{padding:5px 13px;border-radius:20px;border:1px solid #3a3a3c;background:#2c2c2e;color:#8e8e93;font-size:13px;font-weight:700;}
.step-chip.active{background:#f0a500;color:#000;border-color:#f0a500;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.btn-save{background:#f0a500;border-radius:10px;color:#000;font-weight:800;font-size:15px;padding:10px 22px;}
.btn-cancel{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:10px;color:#8e8e93;font-size:15px;padding:10px 18px;}
.btn-del{background:none;border:1px solid #ff453a;border-radius:10px;color:#ff453a;font-size:15px;padding:10px 18px;margin-right:auto;}
.modal-desc{color:#8e8e93;font-size:13px;line-height:1.7;margin-bottom:16px;}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid #3a3a3c;}
.tab{padding:4px 11px;border-radius:20px;border:1px solid #3a3a3c;background:#1c1c1e;color:#8e8e93;font-size:11px;font-weight:600;}
.tab.active{background:#f0a500;color:#000;border-color:#f0a500;}

/* Graph canvas */
.chart-wrap{padding:12px 8px 6px;}
canvas{display:block;width:100%;max-width:100%;}

/* History table */
.tbl-wrap{padding:0 14px 32px;}
.tbl-head{display:flex;justify-content:space-between;padding:8px 10px 5px;border-bottom:1px solid #3a3a3c;margin-bottom:2px;}
.tbl-th{color:#8e8e93;font-size:11px;font-weight:700;}
.tbl-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:7px;margin-bottom:2px;background:#1c1c1e;}
.tbl-row.today{background:#1e2a14;}
.tbl-date{font-size:13px;}
.tbl-val{font-size:15px;font-weight:800;color:#f0a500;}
.tbl-val.achieved{color:#34c759;}
.today-badge{background:#f0a500;color:#000;font-size:9px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:5px;vertical-align:middle;}
</style>
</head>

function getGasUrl(){ return localStorage.getItem("poikatsu_gas_url") || ""; }

// ── 日付 ──────────────────────────────────────────────
function getLogicalDate(offset=0){
  const now = new Date();
  if(now.getHours()<6) now.setDate(now.getDate()-1);
  now.setDate(now.getDate()+offset);
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function fmtTitle(s){return s.replace(/-/g,'/');}
function isToday(s){return s===getLogicalDate(0);}

// ── ストレージ ─────────────────────────────────────────
function loadStorage(){
  try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch{}
  return{sites:BACKUP_DATA.sites,history:{},goal:50};
}
function saveStorage(data){
  const j=JSON.stringify(data);
  localStorage.setItem(STORAGE_KEY,j);
  // カウントのたびに自動でクラウドに送信（no-cors、バックグラウンド）
  autoUpload(j);
}

function autoUpload(j){
  const url = getGasUrl();
  if(!url) return;
  fetch(url, {
    method:'POST',
    mode:'no-cors',
    body: JSON.stringify({key:STORAGE_KEY, value:j||JSON.stringify(state.storage)})
  }).catch(()=>{});
}
async function loadFromCloud(){
  const url = getGasUrl();
  if(!url)return null;
  try{
    const r=await fetch(`${url}?key=${STORAGE_KEY}`);
    const d=await r.json();
    if(d.ok&&d.value)return JSON.parse(d.value);
  }catch(e){
    console.error('loadFromCloud error:', e);
  }
  return null;
}

// ── 状態 ──────────────────────────────────────────────
let state = {
  storage: loadStorage(),
  view: 'counter',       // counter | graph
  dateOffset: 0,
  editSite: null,        // null | site | {_new:true}
  showGoalModal: false,
  showImportModal: false,
  showGasModal: false,
  graphSite: '__total__',
  syncStatus: '',        // ''|syncing|ok|err
  importDone: false,
};

function setState(patch){
  Object.assign(state, typeof patch==='function'?patch(state):patch);
  render();
}

// ── ヘルパー ───────────────────────────────────────────
function getCount(id){
  return (state.storage.history[state.viewDate]||{})[id]||0;
}
function getTotal(){
  return state.storage.sites.reduce((s,site)=>s+getCount(site.id),0);
}
function fmtNum(n){return parseFloat(n.toFixed(2));}

// ── アクション ─────────────────────────────────────────
function updateCount(id,delta){
  const vd = state.viewDate;
  const st = state.storage;
  const day={...(st.history[vd]||{})};
  const d=parseFloat(delta); day[id]=Math.max(0,parseFloat(((parseFloat(day[id])||0)+d).toFixed(4)));
  const next={...st,history:{...st.history,[vd]:day}};
  saveStorage(next);
  setState({storage:next});
}

function saveSite(site){
  const st=state.storage;
  let sites;
  if(st.sites.find(s=>s.id===site.id)){
    sites=st.sites.map(s=>s.id===site.id?site:s);
  }else{
    sites=[...st.sites,{...site,id:Date.now().toString()}];
  }
  const next={...st,sites};
  saveStorage(next);
  setState({storage:next,editSite:null});
}

function deleteSite(id){
  const next={...state.storage,sites:state.storage.sites.filter(s=>s.id!==id)};
  saveStorage(next);
  setState({storage:next,editSite:null});
}

function saveGoal(g){
  const next={...state.storage,goal:g};
  saveStorage(next);
  setState({storage:next,showGoalModal:false});
}

function doImport(){
  const st=state.storage;
  const today=getLogicalDate(0);
  const merged={...st.history,...BACKUP_DATA.history};
  if(st.history[today]) merged[today]=st.history[today];
  const next={sites:BACKUP_DATA.sites,history:merged,goal:st.goal};
  saveStorage(next);
  setState({storage:next,showImportModal:false,importDone:true});
  setTimeout(()=>setState({importDone:false}),3000);
  if(GAS_URL){
    setState({syncStatus:'syncing'});
    setTimeout(async()=>{
      try{
        await fetch(GAS_URL, {
          method:'POST',
          mode:'no-cors',
          body: JSON.stringify({key:STORAGE_KEY, value:JSON.stringify(next)})
        });
        setState({syncStatus:'ok'});
      }catch{setState({syncStatus:'err'});}
      setTimeout(()=>setState({syncStatus:''}),3000);
    },500);
  }
}

// 📤 アップロード（端末A→クラウド）
async function doUpload(){
  const url = getGasUrl();
  if(!url){ setState({syncStatus:'err'}); setTimeout(()=>setState({syncStatus:''}),2000); return; }
  setState({syncStatus:'syncing'});
  const j = JSON.stringify(state.storage);
  try {
    const res = await fetch(url, {
      method:'POST',
      body: JSON.stringify({key:STORAGE_KEY, value:j})
    });
    const d = await res.json();
    setState({syncStatus: d.ok ? 'ok' : 'err'});
  } catch(e) {
    fetch(url, {method:'POST', mode:'no-cors', body: JSON.stringify({key:STORAGE_KEY, value:j})}).catch(()=>{});
    await new Promise(r=>setTimeout(r,1000));
    setState({syncStatus:'ok'});
  }
  setTimeout(()=>setState({syncStatus:''}),3000);
}

// 📥 ダウンロード（クラウド→端末B）
async function doDownload(){
  const url = getGasUrl();
  if(!url){ setState({syncStatus:'err'}); setTimeout(()=>setState({syncStatus:''}),2000); return; }
  setState({syncStatus:'syncing'});
  const cloud = await loadFromCloud();
  if(!cloud){
    setState({syncStatus:'err'});
    setTimeout(()=>setState({syncStatus:''}),3000);
    return;
  }
  const st = state.storage;
  const today = getLogicalDate(0);
  // 過去分はクラウド優先、今日分はカウントが多い方を採用
  const merged = {...st.history, ...cloud.history};
  if(st.history[today] && cloud.history[today]){
    // 今日分は各サイトで大きい値を採用
    const localToday = st.history[today];
    const cloudToday = cloud.history[today];
    const mergedToday = {};
    const allIds = new Set([...Object.keys(localToday), ...Object.keys(cloudToday)]);
    allIds.forEach(id => {
      mergedToday[id] = Math.max(localToday[id]||0, cloudToday[id]||0);
    });
    merged[today] = mergedToday;
  } else if(st.history[today]) {
    merged[today] = st.history[today];
  }
  const next = {...cloud, history: merged};
  localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  setState({storage:next,syncStatus:'ok'});
  // マージ結果をクラウドにも送信
  autoUpload(JSON.stringify(next));
  setTimeout(()=>setState({syncStatus:''}),3000);
}

// 🔄 同期（送信と受信を両方）
async function doCloudSync(){
  await doUpload();
}

// ── グラフ描画 ─────────────────────────────────────────
function drawChart(canvasId, data, goalLine){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.offsetWidth, H=180;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  if(!data.length){return;}

  const PAD={top:16,right:8,bottom:28,left:36};
  const cw=W-PAD.left-PAD.right;
  const ch=H-PAD.top-PAD.bottom;
  const maxVal=Math.max(...data.map(d=>d.value),goalLine||0,1);
  const yScale=v=>(ch-(v/maxVal*ch));

  ctx.clearRect(0,0,W,H);

  // grid lines
  ctx.strokeStyle='#2c2c2e'; ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=PAD.top+ch*t;
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(PAD.left+cw,y);ctx.stroke();
    if(t<1){
      ctx.fillStyle='#8e8e93';ctx.font='9px sans-serif';ctx.textAlign='right';
      ctx.fillText(Math.round(maxVal*(1-t)),PAD.left-4,y+3);
    }
  });

  // bars
  const bw=Math.min(cw/data.length*0.65,28);
  data.forEach((d,i)=>{
    const x=PAD.left+cw*((i+0.5)/data.length)-bw/2;
    const barH=d.value/maxVal*ch;
    const y=PAD.top+ch-barH;
    const grad=ctx.createLinearGradient(0,y,0,PAD.top+ch);
    grad.addColorStop(0,'#f0a500');
    grad.addColorStop(1,'#7a5200');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.roundRect(x,y,bw,barH,3);
    ctx.fill();
  });

  // goal line
  if(goalLine>0){
    const y=PAD.top+yScale(goalLine);
    ctx.strokeStyle='#34c759'; ctx.lineWidth=1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(PAD.left+cw,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#34c759';ctx.font='9px sans-serif';ctx.textAlign='left';
    ctx.fillText('目標'+goalLine,PAD.left+2,y-3);
  }

  // x labels
  ctx.fillStyle='#8e8e93'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  const step=Math.ceil(data.length/8);
  data.forEach((d,i)=>{
    if(i%step===0||i===data.length-1){
      const x=PAD.left+cw*((i+0.5)/data.length);
      ctx.fillText(d.date,x,H-4);
    }
  });
}

<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title">${isNew?'サイトを追加':'サイト設定'}</div>
  <label>サイト名</label>
  <input id="m-name" value="${(editSite.name||'').replace(/"/g,'&quot;')}" placeholder="例: fastask"/>
  <label>カウントの刻み</label>
  <div class="step-row">
    ${[0.1,0.5,1,5,10].map(v=>`<button class="step-chip ${editSite.step==v?'active':''}" onclick="document.getElementById('m-step').value=${v};document.querySelectorAll('.step-chip').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${v}</button>`).join('')}
    <input id="m-step" style="width:75px;margin-bottom:0" value="${editSite.step||1}" placeholder="カスタム"/>
  </div>
  <div class="modal-btns">
    ${!isNew?`<button class="btn-del" onclick="deleteSite('${editSite.id}')">削除</button>`:''}
    <button class="btn-cancel" onclick="setState({editSite:null})">キャンセル</button>
    <button class="btn-save" onclick="
      const nm=document.getElementById('m-name').value.trim();
      const st=parseFloat(document.getElementById('m-step').value);
      if(!nm||isNaN(st)||st<=0)return;
      saveSite({...${JSON.stringify(editSite)},name:nm,step:st});
    ">保存</button>
  </div>
</div>`;
    el.onclick=()=>setState({editSite:null});
    app.appendChild(el);
  }

  if(showGoalModal){
    const el=document.createElement('div');
    el.className='overlay';
    el.innerHTML=`
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title">目標を設定</div>
  <label>1日の目標ポイント</label>
  <input id="g-val" type="number" value="${goal}"/>
  <div class="modal-btns">
    <button class="btn-cancel" onclick="setState({showGoalModal:false})">キャンセル</button>
    <button class="btn-save" onclick="const v=parseFloat(document.getElementById('g-val').value);if(v>0)saveGoal(v);">保存</button>
  </div>
</div>`;
    el.onclick=()=>setState({showGoalModal:false});
    app.appendChild(el);
  }

  if(showImportModal){
    const el=document.createElement('div');
    el.className='overlay';
    el.innerHTML=`
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title">バックアップを読み込む</div>
  <p class="modal-desc">2024/10/29〜2026/6/2の<br><strong style="color:#f0a500">272日分</strong>のデータを復元します。<br><br>⚠️ 既存の日付はバックアップで上書きされます（今日分は保持）</p>
  <div class="modal-btns">
    <button class="btn-cancel" onclick="setState({showImportModal:false})">キャンセル</button>
    <button class="btn-save" onclick="doImport()">読み込む</button>
  </div>
</div>`;
    el.onclick=()=>setState({showImportModal:false});
    app.appendChild(el);
  }

  if(showGasModal){
    const curUrl=localStorage.getItem('poikatsu_gas_url')||'';
    const el=document.createElement('div');
    el.className='overlay';
    el.innerHTML=`
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-title">☁️ クラウド同期設定</div>
  <p class="modal-desc">Google Apps ScriptのデプロイURLを貼り付けると複数端末で同期できます。</p>
  <label>GAS デプロイURL</label>
  <input id="gas-url" style="font-size:11px" value="${curUrl}" placeholder="https://script.google.com/macros/s/..."/>
  <div class="modal-btns">
    ${curUrl?`<button class="btn-del" onclick="localStorage.removeItem('poikatsu_gas_url');GAS_URL='';document.getElementById('gas-url').value=''">クリア</button>`:''}
    <button class="btn-cancel" onclick="setState({showGasModal:false})">キャンセル</button>
    <button class="btn-save" onclick="
      const u=document.getElementById('gas-url').value.trim();
      localStorage.setItem('poikatsu_gas_url',u);
      GAS_URL=u;
      setState({showGasModal:false});
      if(u){ setTimeout(()=>doDownload(), 300); }
    ">保存して同期</button>
  </div>
</div>`;
    el.onclick=()=>setState({showGasModal:false});
    app.appendChild(el);
  }
}

// ── 初期化 ────────────────────────────────────────────
setInterval(()=>{
  const d=getLogicalDate(0);
  if(d!==state.viewDate&&state.dateOffset===0) render();
},30000);

render();
</script>
</body>
</html>
